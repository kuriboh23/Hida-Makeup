<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header - HIDA.MAKEUP</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* =========================
           GLOBAL RESETS & VARIABLES
        ========================= */
        :root {
            --burgundy: #7d3638;
            --burgundy-dark: #542527;
            --rose: #f5e7e4;
            --rose-light: #fbf5f3;
            --text: #242020;
            --muted: #77706e;
            --border: #eee5e1;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", sans-serif;
            color: var(--text);
            background: var(--white);
            line-height: 1.5;
        }

        .container {
            width: min(1180px, calc(100% - 40px));
            margin: auto;
        }

        /* =========================
           TOP BAR
        ========================= */
        .topbar {
            background: #5a2a2b;
            color: var(--white);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            padding: 12px 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* =========================
           HEADER & NAVIGATION
        ========================= */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .header-inner {
            height: 76px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            justify-self: center;
            text-decoration: none;
            color: var(--text);
        }

        .logo span {
            color: var(--burgundy);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav a {
            font-size: 13px;
            font-weight: 600;
            color: #514b49;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--burgundy);
        }

        /* =========================
           HEADER ACTIONS & BUTTONS
        ========================= */
        .header-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 18px;
        }

        .icon-btn {
            border: 0;
            background: transparent;
            cursor: pointer;
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            font-size: 16px;
            color: var(--text);
            border-radius: 50%;
            transition: background 0.2s ease, color 0.2s ease;
            text-decoration: none;
        }

        .icon-btn:hover {
            background: var(--rose);
            color: var(--burgundy);
        }

        .cart-btn {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -2px;
            right: -3px;
            background: var(--burgundy);
            color: var(--white);
            width: 17px;
            height: 17px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 9px;
            font-weight: 700;
        }

        .mobile-menu-btn {
            display: none;
        }

        /* =========================
           MOBILE MENU DRAWER
        ========================= */
        .mobile-menu {
            position: fixed;
            inset: 0;
            background: var(--white);
            z-index: 2000;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            padding: 25px;
        }

        .mobile-menu.active {
            transform: translateX(0);
        }

        .mobile-menu-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }

        .mobile-links {
            display: grid;
            gap: 0;
            margin-top: 20px;
        }

        .mobile-links a {
            padding: 18px 0;
            border-bottom: 1px solid var(--border);
            font-family: "Playfair Display", serif;
            font-size: 24px;
            text-decoration: none;
            color: var(--text);
        }

        .close-btn {
            border: 0;
            background: var(--rose);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: grid;
            place-items: center;
            color: var(--text);
        }

        /* =========================
           HEADER RESPONSIVE MEDIA QUERIES
        ========================= */
        @media (max-width: 1000px) {
            .nav {
                display: none;
            }

            .mobile-menu-btn {
                display: grid;
            }

            .header-inner {
                grid-template-columns: 1fr auto 1fr;
            }

            .header-inner .mobile-menu-btn {
                justify-self: start;
            }
        }

        @media (max-width: 500px) {
            .topbar {
                font-size: 11px;
            }

            .header-inner {
                height: 65px;
            }

            .logo {
                font-size: 17px;
            }

            .header-actions {
                gap: 4px;
            }

            .header-actions .search-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <i class="fa-solid fa-truck-fast"></i> LIVRAISON PARTOUT AU MAROC | PAIEMENT À LA LIVRAISON
    </div>

    <!-- HEADER -->
    <header>
        <div class="container header-inner">
            <button class="icon-btn mobile-menu-btn" onclick="openMenu()" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <nav class="nav">
                <a href="index.html">Accueil</a>
                <a href="products.html" class="active">Boutique</a>
                <a href="categories.html">Catégories</a>
                <a href="about.html">À propos</a>
            </nav>

            <a href="index.html" class="logo">
                HIDA<span>.</span>MAKEUP
            </a>

            <div class="header-actions">
                <button class="icon-btn search-btn" aria-label="Rechercher" onclick="document.querySelector('.shop-search-input')?.focus()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <a href="wishlist.html" class="icon-btn" aria-label="Favoris">
                    <i class="fa-regular fa-heart"></i>
                </a>
                <a href="cart.html" class="icon-btn cart-btn" aria-label="Panier">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-count">2</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MOBILE MENU DRAWER -->
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-top">
            <div class="logo">HIDA<span style="color:var(--burgundy)">.</span>MAKEUP</div>
            <button class="close-btn" onclick="closeMenu()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav class="mobile-links">
            <a href="index.html">Accueil</a>
            <a href="products.html">Boutique</a>
            <a href="categories.html">Catégories</a>
            <a href="wishlist.html">Mes favoris</a>
            <a href="about.html">À propos</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>

    <script>
        function openMenu() {
            document.getElementById("mobileMenu").classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeMenu() {
            document.getElementById("mobileMenu").classList.remove("active");
            document.body.style.overflow = "";
        }
    </script>
</body>
</html>
